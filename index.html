<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invisible | Minimal Resume Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.1/dist/pizzip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --border: #1a1a1a;
            --accent: #ffffff;
            --text-secondary: #666666;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: #ffffff;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .minimal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: border-color 0.3s ease;
        }

        .minimal-card:hover {
            border-color: #333333;
        }

        .minimal-input {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .minimal-input:focus {
            border-color: var(--accent);
            outline: none;
        }

        .btn-minimal {
            background: var(--accent);
            color: #000000;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .btn-minimal:hover:not(:disabled) {
            opacity: 0.9;
            transform: scale(0.99);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: #ffffff;
        }

        .btn-secondary:hover {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        #dropzone.active {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.02);
        }

        #dropzone.file-loaded {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.02);
        }

        .progress-line {
            height: 1px;
            background: #1a1a1a;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .progress-line-fill {
            height: 100%;
            background: #ffffff;
            width: 0;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        ::selection {
            background: #ffffff;
            color: #000000;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #333333;
            border-radius: 10px;
        }
    </style>
</head>

<body class="py-16 px-6">
    <div class="max-w-2xl mx-auto">
        <!-- Minimal Header -->
        <header class="mb-16 text-center">
            <h1 class="text-3xl font-light tracking-widest mb-3 uppercase">Invisible</h1>
            <p class="text-secondary text-sm font-light">Zero-touch document optimization powered by Gemini.</p>
        </header>

        <main class="space-y-6">
            <!-- API Configuration -->
            <section class="minimal-card p-6">
                <div class="flex items-center justify-between mb-4">
                    <label class="text-xs uppercase tracking-widest text-secondary">Gemini Key</label>
                    <span id="apiKeyStatus"
                        class="text-[10px] uppercase tracking-tighter text-secondary">Disconnected</span>
                </div>
                <input type="password" id="apiKey" placeholder="Paste Key"
                    class="w-full p-3 text-sm minimal-input font-mono">
            </section>

            <!-- File Upload -->
            <label for="fileInput" id="dropzone"
                class="relative minimal-card p-10 border-dashed border-2 flex flex-col items-center justify-center cursor-pointer group transition-all duration-300">
                <input type="file" id="fileInput" accept=".docx" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" style="z-index: 10;">
                <div id="uploadIcon" class="mb-4 text-secondary group-hover:text-white transition-colors relative z-0">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                    </svg>
                </div>
                <p id="fileName" class="text-sm font-light text-secondary group-hover:text-white transition-colors relative z-0">
                    Select .docx Resume</p>
                <p id="fileSubtext" class="text-[10px] uppercase mt-2 text-secondary tracking-widest relative z-0">Preserves Original
                    Formatting</p>
            </label>

            <!-- Job Description -->
            <section class="minimal-card p-6">
                <label class="text-xs uppercase tracking-widest text-secondary block mb-4">Target Job
                    Description</label>
                <textarea id="jdInput" placeholder="Paste requirements here..."
                    class="w-full h-48 p-4 text-sm minimal-input resize-none font-light leading-relaxed"></textarea>
            </section>

            <!-- Extra Instructions -->
            <section class="minimal-card p-6 space-y-6">
                <div>
                    <label class="text-xs uppercase tracking-widest text-secondary block mb-4">Resume (CV) Extra Instructions</label>
                    <textarea id="resumeInstructions" placeholder="e.g., Emphasize leadership, keep under one page, focus on technical skills..."
                        class="w-full h-24 p-4 text-sm minimal-input resize-none font-light leading-relaxed"></textarea>
                </div>
                <div>
                    <label class="text-xs uppercase tracking-widest text-secondary block mb-4">Cover Letter Extra Instructions</label>
                    <textarea id="clInstructions" placeholder="e.g., Mention relocation interest, standard professional tone..."
                        class="w-full h-24 p-4 text-sm minimal-input resize-none font-light leading-relaxed"></textarea>
                </div>
            </section>

            <!-- Progress & Actions -->
            <div id="progressArea" class="hidden space-y-4 py-4">
                <div class="flex justify-between text-[10px] uppercase tracking-widest text-secondary">
                    <span id="progressText">Processing</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-line">
                    <div id="progressBar" class="progress-line-fill"></div>
                </div>
            </div>

            <div id="actionArea">
                <button id="optimizeBtn" class="w-full p-4 btn-minimal rounded-lg uppercase tracking-widest text-xs">
                    Optimize Documents
                </button>
            </div>

            <!-- Log Area -->
            <div id="logArea" class="hidden minimal-card p-4 font-mono text-[10px] text-secondary h-32 overflow-y-auto space-y-1"></div>

            <!-- Success State -->
            <div id="successArea" class="hidden space-y-6">
                <div class="minimal-card p-8 text-center border-green-900/30">
                    <div class="text-green-500 mb-4 inline-block">
                        <svg class="w-10 h-10 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M5 13l4 4L19 7">
                            </path>
                        </svg>
                    </div>
                    <h3 class="text-sm uppercase tracking-widest mb-2 font-light">Optimized Files Ready</h3>
                    <p class="text-[10px] text-secondary uppercase tracking-tighter">Verified by Gemini 1.5 Flash</p>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <button id="downloadCvBtn"
                        class="p-4 btn-secondary rounded-lg text-xs uppercase tracking-widest">CV</button>
                    <button id="downloadClBtn"
                        class="p-4 btn-secondary rounded-lg text-xs uppercase tracking-widest">Cover Letter</button>
                </div>

                <button onclick="location.reload()"
                    class="w-full text-[10px] uppercase tracking-widest text-secondary hover:text-white transition-colors py-4">
                    Start New Process
                </button>
            </div>
        </main>

        <!-- Minimal Social Links -->
        <footer class="mt-24 pt-12 border-t border-[#111111]">
            <div class="flex justify-center gap-8 text-secondary mb-8">
                <a href="https://kisalnelaka.github.io" target="_blank"
                    class="text-[10px] uppercase tracking-widest hover:text-white transition-colors">Portfolio</a>
                <a href="https://github.com/kisalnelaka" target="_blank"
                    class="text-[10px] uppercase tracking-widest hover:text-white transition-colors">GitHub</a>
                <a href="https://www.linkedin.com/in/kisalnelaka/" target="_blank"
                    class="text-[10px] uppercase tracking-widest hover:text-white transition-colors">LinkedIn</a>
            </div>
            <p class="text-center text-[10px] text-[#333333] uppercase tracking-[0.2em] font-light">
                &copy; 2026 Invisible Architecture
            </p>
        </footer>
    </div>

    <!-- Logic -->
    <script type="module">
        const elements = {
            apiKey: document.getElementById('apiKey'),
            dropzone: document.getElementById('dropzone'),
            fileInput: document.getElementById('fileInput'),
            fileName: document.getElementById('fileName'),
            fileSubtext: document.getElementById('fileSubtext'),
            jdInput: document.getElementById('jdInput'),
            resumeInstructions: document.getElementById('resumeInstructions'),
            clInstructions: document.getElementById('clInstructions'),
            optimizeBtn: document.getElementById('optimizeBtn'),
            progressArea: document.getElementById('progressArea'),
            progressText: document.getElementById('progressText'),
            progressPercent: document.getElementById('progressPercent'),
            progressBar: document.getElementById('progressBar'),
            apiKeyStatus: document.getElementById('apiKeyStatus'),
            actionArea: document.getElementById('actionArea'),
            logArea: document.getElementById('logArea'),
            successArea: document.getElementById('successArea'),
            downloadCvBtn: document.getElementById('downloadCvBtn'),
            downloadClBtn: document.getElementById('downloadClBtn')
        };

        let state = {
            selectedFile: null,
            cvBlob: null,
            clBlob: null,
            userName: '',
            targetTitle: '',
            companyName: ''
        };

        // Logging Utility
        function uiLog(msg, type = 'info') {
            const color = type === 'error' ? 'text-red-500' : (type === 'success' ? 'text-green-500' : 'text-secondary');
            const time = new Date().toLocaleTimeString();
            elements.logArea.classList.remove('hidden');
            elements.logArea.innerHTML += `<div class="${color}">[${time}] ${msg}</div>`;
            elements.logArea.scrollTop = elements.logArea.scrollHeight;
            console.log(`[${type}] ${msg}`);
        }

        // Persistence
        try {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                elements.apiKey.value = savedKey;
                updateKeyStatus(true);
            }
        } catch (e) {
            uiLog('Warning: Could not access localStorage. API key will not be saved.', 'error');
        }

        elements.apiKey.oninput = (e) => {
            const val = e.target.value.trim();
            try {
                localStorage.setItem('gemini_api_key', val);
            } catch (e) {
                // Ignore localStorage errors
            }
            updateKeyStatus(!!val);
        };

        function updateKeyStatus(hasKey) {
            elements.apiKeyStatus.innerText = hasKey ? 'Encrypted' : 'Disconnected';
            elements.apiKeyStatus.className = hasKey ? 'text-[10px] uppercase tracking-tighter text-green-500' : 'text-[10px] uppercase tracking-tighter text-secondary';
        }

        // --- File Upload Logic ---
        elements.fileInput.onchange = (e) => {
            if (e.target.files && e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        };

        elements.dropzone.ondragover = (e) => {
            e.preventDefault();
            e.stopPropagation();
            elements.dropzone.classList.add('active');
        };
        elements.dropzone.ondragleave = (e) => {
            e.preventDefault();
            e.stopPropagation();
            elements.dropzone.classList.remove('active');
        };
        elements.dropzone.ondrop = (e) => {
            e.preventDefault();
            e.stopPropagation();
            elements.dropzone.classList.remove('active');
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        };

        function handleFile(file) {
            if (file && file.name.toLowerCase().endsWith('.docx')) {
                state.selectedFile = file;
                elements.fileName.innerText = file.name;
                elements.fileName.classList.add('text-white');
                elements.fileSubtext.innerText = 'Document Ready';
                elements.fileSubtext.classList.remove('text-secondary');
                elements.fileSubtext.classList.add('text-green-500');
                elements.dropzone.classList.add('file-loaded');
                document.getElementById('uploadIcon').innerHTML = `<svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>`;
                uiLog(`Resume uploaded: ${file.name}`, 'success');
            } else if (file) {
                uiLog('Failed: Only .docx files are supported.', 'error');
                resetUpload();
            }
        }

        function resetUpload() {
            state.selectedFile = null;
            elements.fileName.innerText = 'Select .docx Resume';
            elements.fileName.classList.remove('text-white');
            elements.fileSubtext.innerText = 'Preserves Original Formatting';
            elements.fileSubtext.classList.add('text-secondary');
            elements.fileSubtext.classList.remove('text-green-500');
            elements.dropzone.classList.remove('file-loaded');
            document.getElementById('uploadIcon').innerHTML = `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>`;
            elements.fileInput.value = '';
        }

        function updateProgress(percent, text) {
            elements.progressArea.classList.remove('hidden');
            elements.progressText.innerText = text;
            elements.progressPercent.innerText = `${percent}%`;
            elements.progressBar.style.width = `${percent}%`;
        }

        // --- Optimization Logic ---
        elements.optimizeBtn.onclick = async () => {
            const key = elements.apiKey.value.trim();
            const jd = elements.jdInput.value.trim();

            if (!key) { uiLog('API Key Required.', 'error'); return; }
            if (!state.selectedFile) { uiLog('Please Select a .docx Resume.', 'error'); return; }
            if (!jd) { uiLog('Please Paste Job Description.', 'error'); return; }

            try {
                uiLog('Optimization process started...');
                toggleLoading(true);
                
                updateProgress(10, 'Parsing Structure');
                uiLog('Extracting text from DOCX using Mammoth...');
                if (!window.mammoth) throw new Error("Mammoth library failed to load from CDN.");
                const arrayBuffer = await state.selectedFile.arrayBuffer();
                const { value: resumeText } = await window.mammoth.extractRawText({ arrayBuffer });
                uiLog(`Successfully extracted ${resumeText.length} characters of text.`, 'success');

                updateProgress(40, 'AI Synthesis');
                uiLog('Importing Google Generative AI...');
                const { GoogleGenerativeAI } = await import("https://esm.run/@google/generative-ai");
                uiLog('Google Generative AI initialized.');
                const genAI = new GoogleGenerativeAI(key);
                const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash" });
                
                uiLog('Sending prompt to Gemini model...');

                const systemInstruction = `You are a career architect. Your goal is to optimize the provided resume for ATS while preserving 100% of the facts.
Rewrite summarized sections to align with keywords in the Job Description.
Also generate a full Cover Letter (Salutation, Intro, Body, Closing, Signature).
CRITICAL: Do not use em dashes (—) under any circumstances in your output text. Use normal hyphens (-) or standard punctuation instead.

Return JSON:
{
  "userName": "Name",
  "targetTitle": "Title",
  "companyName": "Company",
  "cvReplacements": [{ "find": "original exact text", "replace": "optimized text" }],
  "coverLetter": "Full text..."
}`;

                const resumeInst = elements.resumeInstructions.value.trim();
                const clInst = elements.clInstructions.value.trim();

                let promptText = `${systemInstruction}\n\nRESUME:\n${resumeText}\n\nJD:\n${jd}`;
                if (resumeInst) {
                    promptText += `\n\nEXTRA INSTRUCTIONS FOR RESUME (CV) OPTIMIZATION:\n${resumeInst}`;
                }
                if (clInst) {
                    promptText += `\n\nEXTRA INSTRUCTIONS FOR COVER LETTER GENERATION:\n${clInst}`;
                }

                const result = await model.generateContent(promptText);
                const responseText = result.response.text();
                uiLog('Received response from Gemini.', 'success');
                const jsonMatch = responseText.match(/\{[\s\S]*\}/);
                if (!jsonMatch) throw new Error("AI did not return valid JSON. Please try again.");
                const aiData = JSON.parse(jsonMatch[0]);

                state.userName = aiData.userName;
                state.targetTitle = aiData.targetTitle;
                state.companyName = aiData.companyName;

                updateProgress(75, 'Injecting XML');
                uiLog('Parsing Word Document XML...');
                if (!window.PizZip) throw new Error("PizZip library failed to load from CDN.");
                const zip = new window.PizZip(arrayBuffer);
                let xml = zip.file("word/document.xml").asText();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xml, "application/xml");
                const paragraphs = xmlDoc.getElementsByTagName('w:p');

                const clean = (str) => str.replace(/\s+/g, ' ').trim();
                let replacementsMade = 0;

                for (let p of paragraphs) {
                    const textNodes = p.getElementsByTagName('w:t');
                    if (textNodes.length === 0) continue;

                    let paraText = Array.from(textNodes).map(t => t.textContent).join('');
                    const originalPara = paraText;

                    for (let r of aiData.cvReplacements) {
                        const cleanFind = clean(r.find);
                        const cleanPara = clean(paraText);
                        if (cleanPara.includes(cleanFind)) {
                            if (paraText.includes(r.find)) paraText = paraText.replace(r.find, r.replace);
                            else if (cleanPara === cleanFind) paraText = r.replace;
                            replacementsMade++;
                        }
                    }

                    if (paraText !== originalPara) {
                        textNodes[0].textContent = paraText;
                        for (let i = textNodes.length - 1; i > 0; i--) textNodes[i].parentNode.removeChild(textNodes[i]);
                    }
                }
                
                uiLog(`Successfully injected ${replacementsMade} smart replacements into your CV.`, 'success');

                zip.file("word/document.xml", new XMLSerializer().serializeToString(xmlDoc));
                state.cvBlob = zip.generate({ type: "blob" });

                updateProgress(90, 'Finalizing Documents');
                uiLog('Generating custom Cover Letter document...');
                state.clBlob = await generateCoverLetterDoc(aiData.coverLetter, state.userName);

                updateProgress(100, 'Complete');
                uiLog('Optimization complete! Documents ready for download.', 'success');
                setTimeout(() => {
                    elements.actionArea.classList.add('hidden');
                    elements.progressArea.classList.add('hidden');
                    elements.successArea.classList.remove('hidden');
                    toggleLoading(false);
                }, 1000);

            } catch (err) {
                uiLog(`Optimization Failed: ${err.message}`, 'error');
                toggleLoading(false);
            }
        };

        // --- Document Generation (Library-Free Approach) ---
        async function generateCoverLetterDoc(text, name) {
            const zip = new window.PizZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
            <Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
                <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
                <Default Extension="xml" ContentType="application/xml"/>
                <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
            </Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
            <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
                <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
            </Relationships>`);

            const cleanName = name.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const cleanText = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const xmlParagraphs = cleanText.split('\n').map(line => {
                if (!line.trim()) return '<w:p/>';
                return `<w:p><w:r><w:t>${line}</w:t></w:r></w:p>`;
            }).join('');

            const finalXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
                    <w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
                        <w:body>
                            <w:p><w:r><w:rPr><w:b/><w:sz w:val="28"/></w:rPr><w:t>${cleanName}</w:t></w:r></w:p>
                            <w:p><w:r><w:t>${new Date().toLocaleDateString()}</w:t></w:r></w:p>
                            <w:p/>
                            ${xmlParagraphs}
                        </w:body>
                    </w:document>`;

            zip.file("word/document.xml", finalXml);
            return zip.generate({ type: "blob" });
        }

        // --- Action Handlers ---
        elements.downloadCvBtn.onclick = () => {
            const name = (state.userName || 'Resume').replace(/[^a-z0-9]/gi, '_');
            const title = (state.targetTitle || 'Optimized').replace(/[^a-z0-9]/gi, '_');
            window.saveAs(state.cvBlob, `${name}-${title}.docx`);
        };

        elements.downloadClBtn.onclick = () => {
            const name = (state.userName || 'Resume').replace(/[^a-z0-9]/gi, '_');
            const company = (state.companyName || 'Company').replace(/[^a-z0-9]/gi, '_');
            const title = (state.targetTitle || 'Position').replace(/[^a-z0-9]/gi, '_');
            window.saveAs(state.clBlob, `${name}-${company}-${title}.docx`);
        };

        function toggleLoading(isLoading) {
            elements.optimizeBtn.disabled = isLoading;
            elements.optimizeBtn.innerText = isLoading ? 'Optimizing...' : 'Optimize Documents';
            if (isLoading) elements.optimizeBtn.style.opacity = '0.5';
            else elements.optimizeBtn.style.opacity = '1';
        }
    </script>
</body>

</html>
